name: Grade
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/grade.py
      - name: Commit results.json
        run: |
          git config user.name "skillforge-bot"
          git config user.email "bot@skillforge.local"
          git add results.json
          git commit -m "chore: update grading results [skip ci]" || echo "no changes"
          git push
